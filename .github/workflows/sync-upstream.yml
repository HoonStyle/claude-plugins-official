name: Sync upstream

# Fork maintenance:
#   1. Merge upstream (anthropics/<this repo name>) main into this fork's main.
#   2. Disable every other workflow inherited from upstream so it does not run
#      in this fork. Add a workflow path to KEEP_WORKFLOWS to exempt it.
#
# Runs daily and on demand (Actions tab -> "Sync upstream" -> "Run workflow").

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC = 12:00 KST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_OWNER: anthropics
  SYNC_BRANCH: main
  SELF_WORKFLOW: .github/workflows/sync-upstream.yml
  # Space-separated workflow paths that must stay enabled besides this one.
  KEEP_WORKFLOWS: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0

      - name: Merge upstream into fork
        run: |
          set -euo pipefail
          upstream="https://github.com/${UPSTREAM_OWNER}/${GITHUB_REPOSITORY#*/}.git"
          git fetch --no-tags "${upstream}" "${SYNC_BRANCH}"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with ${upstream} (${SYNC_BRANCH})."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff \
            -m "sync: merge upstream ${SYNC_BRANCH} ($(git rev-parse --short FETCH_HEAD))" \
            FETCH_HEAD
          git push origin "HEAD:${SYNC_BRANCH}"
          echo "Merged $(git rev-list --count 'HEAD^1..FETCH_HEAD') upstream commit(s)."

      - name: Disable workflows inherited from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          keep="${SELF_WORKFLOW} ${KEEP_WORKFLOWS}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            | jq -r '.workflows[] | select(.state == "active") | "\(.id) \(.path)"' \
            | while read -r id path; do
                case " ${keep} " in
                  *" ${path} "*) continue ;;
                esac
                echo "Disabling ${path}"
                gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable"
              done
          echo "Done."
